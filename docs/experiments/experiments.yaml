# experiments registry — single source of truth (§34 of CLAUDE.md).
# `schema` is generated from scripts/check_registries.py; do not edit it by hand.
# IDs are stable and never reused: move removed IDs to `retired_ids`.
schema:
  schema_version: 1
  registry: experiments
  spec_sections: §34
  id_field: id
  id_pattern: ^EXP-[A-Z][A-Z0-9]*-\d{3,}$
  fields:
    id:
      type: str
      required: true
      nullable: false
    question:
      type: str
      required: true
      nullable: false
    hypothesis:
      type: str
      required: true
      nullable: false
    priority:
      type: str
      required: true
      nullable: false
      enum:
      - P0
      - P1
      - P2
      - P3
    dataset:
      type: any
      required: true
      nullable: false
    population:
      type: str
      required: true
      nullable: true
    input:
      type: str
      required: true
      nullable: false
    reference:
      type: str
      required: true
      nullable: false
    candidate_method:
      type: any
      required: true
      nullable: false
    parameters:
      type: any
      required: true
      nullable: true
    primary_metric:
      type: str
      required: true
      nullable: false
    secondary_metrics:
      type: list
      required: true
      nullable: true
    statistical_method:
      type: str
      required: true
      nullable: false
    unit_of_inference:
      type: str
      required: true
      nullable: false
      enum:
      - sample
      - pulse
      - event
      - window
      - recording
      - subject
    decision_affected:
      type: list
      required: true
      nullable: false
      ref: decisions
    acceptance_condition:
      type: str
      required: true
      nullable: false
    failure_condition:
      type: str
      required: true
      nullable: false
    status:
      type: str
      required: true
      nullable: false
      enum:
      - PROPOSED
      - APPROVED
      - RUNNING
      - COMPLETED
      - ABANDONED
retired_ids: []
entries: []
